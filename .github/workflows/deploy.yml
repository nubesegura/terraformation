name: Deploy

# CI + despliegue a AWS con OIDC (sin claves de larga duración) en un único run por push.
#  - push a `develop` → CI → entorno `dev`
#  - push a `main`    → CI → entorno `prod` (proteger el environment con revisores requeridos)
#  - manual           → ejecútalo sobre `develop` o `main`; el entorno se deduce de la rama
# El despliegue corre siempre que el CI pase. En `prod`, el environment debe tener revisores requeridos.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Un despliegue por entorno a la vez (evita dos operaciones simultáneas sobre el mismo stack).
concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuración del environment
        # Los valores llegan por env (no interpolados en el script) y se validan antes de usarlos.
        run: |
          for v in AWS_REGION STATE_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::Falta la variable $v en el environment $ENVIRONMENT"; exit 1; }
          done
          [ -n "$ROLE_ARN" ] || { echo "::error::Falta el secret ROLE_ARN"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || { echo "::error::AWS_REGION no válida"; exit 1; }
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "::error::STATE_BUCKET no válido"; exit 1; }
          [[ -z "$ARTIFACT_BUCKET" || "$ARTIFACT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "::error::ARTIFACT_BUCKET no válido"; exit 1; }
          set -f  # sin expansión de comodines al separar EXTRA_PARAMS
          for p in $EXTRA_PARAMS; do
            [[ "$p" =~ ^[A-Za-z][A-Za-z0-9]*=[A-Za-z0-9._:/@,+-]*$ ]] || { echo "::error::EXTRA_PARAMS contiene un parámetro no válido: $p"; exit 1; }
          done
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          EXTRA_PARAMS: ${{ vars.EXTRA_PARAMS }}
          ROLE_ARN: ${{ secrets.ROLE_ARN }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Entorno Python
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e "backend[dev]" aws-sam-cli
      - name: Desplegar infraestructura
        # EXTRA_PARAMS se deja sin comillas a propósito (varios pares Clave=Valor); ya fue validado arriba.
        run: |
          make deploy ENV="$ENVIRONMENT" REGION="$AWS_REGION" \
            STATE_BUCKET="$STATE_BUCKET" ARTIFACT_BUCKET="$ARTIFACT_BUCKET" EXTRA_PARAMS="$EXTRA_PARAMS"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          EXTRA_PARAMS: ${{ vars.EXTRA_PARAMS }}
      - name: Publicar frontend
        run: make web-deploy ENV="$ENVIRONMENT" REGION="$AWS_REGION"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
