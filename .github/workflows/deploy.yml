name: Deploy

# CI + deployment to AWS with OIDC (no long-lived keys) in a single run per push.
#  - push to `develop` → CI → `dev` environment
#  - push to `main`    → CI → `prod` environment (protect the environment with required reviewers)
#  - manual           → run it on `develop` or `main`; the environment is derived from the branch
# Deployment runs whenever CI passes. On `prod`, the environment must have required reviewers.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deployment per environment at a time (avoids two simultaneous operations on the same stack).
concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment configuration
        # Values arrive through env (not interpolated into the script) and are validated before use.
        run: |
          for v in AWS_REGION STATE_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::Missing variable $v in environment $ENVIRONMENT"; exit 1; }
          done
          [ -n "$ROLE_ARN" ] || { echo "::error::Missing the ROLE_ARN secret"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || { echo "::error::AWS_REGION is not valid"; exit 1; }
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "::error::STATE_BUCKET is not valid"; exit 1; }
          [[ -z "$ARTIFACT_BUCKET" || "$ARTIFACT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "::error::ARTIFACT_BUCKET is not valid"; exit 1; }
          set -f  # no wildcard expansion when splitting EXTRA_PARAMS
          for p in $EXTRA_PARAMS; do
            [[ "$p" =~ ^[A-Za-z][A-Za-z0-9]*=[A-Za-z0-9._:/@,+-]*$ ]] || { echo "::error::EXTRA_PARAMS contains an invalid parameter: $p"; exit 1; }
          done
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          EXTRA_PARAMS: ${{ vars.EXTRA_PARAMS }}
          ROLE_ARN: ${{ secrets.ROLE_ARN }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Entorno Python
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e "backend[dev]" aws-sam-cli
      - name: Desplegar infraestructura
        # EXTRA_PARAMS is intentionally left unquoted (several Key=Value pairs); it was already validated above.
        run: |
          make deploy ENV="$ENVIRONMENT" REGION="$AWS_REGION" \
            STATE_BUCKET="$STATE_BUCKET" ARTIFACT_BUCKET="$ARTIFACT_BUCKET" EXTRA_PARAMS="$EXTRA_PARAMS"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          EXTRA_PARAMS: ${{ vars.EXTRA_PARAMS }}
      - name: Publicar frontend
        run: make web-deploy ENV="$ENVIRONMENT" REGION="$AWS_REGION"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
