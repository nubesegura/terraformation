AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Terraformation - event-driven ingestion (EventBridge), locks, backfill and reconciliation

Parameters:
  AppName: { Type: String }
  Environment: { Type: String }
  StateBucketName: { Type: String }
  TableName: { Type: String }
  TableArn: { Type: String }
  DlqArn: { Type: String }
  DlqUrl: { Type: String }
  LockAlertMinutes: { Type: Number }
  ReconcileSchedule: { Type: String }
  ReconcileEnabled: { Type: String, AllowedValues: ["true", "false"] }
  LogRetentionDays: { Type: Number }
  LogLevel: { Type: String }
  EnableXRay: { Type: String, AllowedValues: ["true", "false"] }
  ManageBucketNotifications: { Type: String, AllowedValues: ["true", "false"] }
  DisableNotificationsOnDelete: { Type: String, AllowedValues: ["true", "false"] }
  IngestReservedConcurrency: { Type: Number }
  MaxStateBytes: { Type: Number }

Conditions:
  XRayOn: !Equals [!Ref EnableXRay, "true"]
  ManageNotifications: !Equals [!Ref ManageBucketNotifications, "true"]
  ReserveConcurrency: !Not [!Equals [!Ref IngestReservedConcurrency, 0]]
  ScheduleOn: !Equals [!Ref ReconcileEnabled, "true"]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 1024
    Tracing: !If [XRayOn, Active, PassThrough]
    Environment:
      Variables:
        TABLE_NAME: !Ref TableName
        STATE_BUCKET: !Ref StateBucketName
        LOCK_ALERT_MINUTES: !Ref LockAlertMinutes
        MAX_STATE_BYTES: !Ref MaxStateBytes
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_TRACE_DISABLED: !If [XRayOn, "false", "true"]

Resources:
  # ------------------------------------------------------------------ logs
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-ingest"
      RetentionInDays: !Ref LogRetentionDays
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Encrypted with the key managed by the CloudWatch Logs service; avoids the cost of a KMS CMK
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED
  LockLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-locks"
      RetentionInDays: !Ref LogRetentionDays
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Encrypted with the key managed by the CloudWatch Logs service; avoids the cost of a KMS CMK
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED
  BackfillLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-backfill"
      RetentionInDays: !Ref LogRetentionDays
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Encrypted with the key managed by the CloudWatch Logs service; avoids the cost of a KMS CMK
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED
  ReconcileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-reconcile"
      RetentionInDays: !Ref LogRetentionDays
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Encrypted with the key managed by the CloudWatch Logs service; avoids the cost of a KMS CMK
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED
  NotificationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-bucket-notifications"
      RetentionInDays: !Ref LogRetentionDays
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Encrypted with the key managed by the CloudWatch Logs service; avoids the cost of a KMS CMK
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED

  # ------------------------------------------------------------------ roles (least privilege)
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IngestLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchWriteItem]
                Resource: !Ref TableArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref DlqArn
              - !If
                - XRayOn
                - { Effect: Allow, Action: [xray:PutTraceSegments, xray:PutTelemetryRecords], Resource: "*" }
                - !Ref AWS::NoValue
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_290
            comment: xray:Put* does not support resource-level restriction
          - id: CKV_AWS_355
            comment: xray:Put* requires Resource "*" (only if EnableXRay=true)

  LockRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: locks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LockLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !Ref TableArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref DlqArn
              - !If
                - XRayOn
                - { Effect: Allow, Action: [xray:PutTraceSegments, xray:PutTelemetryRecords], Resource: "*" }
                - !Ref AWS::NoValue
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_290
            comment: xray:Put* does not support resource-level restriction
          - id: CKV_AWS_355
            comment: xray:Put* requires Resource "*" (only if EnableXRay=true)

  BackfillRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: backfill
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BackfillLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchWriteItem]
                Resource: !Ref TableArn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-${Environment}-backfill"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref DlqArn
              - !If
                - XRayOn
                - { Effect: Allow, Action: [xray:PutTraceSegments, xray:PutTelemetryRecords], Resource: "*" }
                - !Ref AWS::NoValue
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_290
            comment: xray:Put* does not support resource-level restriction
          - id: CKV_AWS_355
            comment: xray:Put* requires Resource "*" (only if EnableXRay=true)

  ReconcileRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: reconcile
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ReconcileLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchWriteItem]
                Resource: !Ref TableArn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-${Environment}-reconcile"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref DlqArn
              - !If
                - XRayOn
                - { Effect: Allow, Action: [xray:PutTraceSegments, xray:PutTelemetryRecords], Resource: "*" }
                - !Ref AWS::NoValue
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_290
            comment: xray:Put* does not support resource-level restriction
          - id: CKV_AWS_355
            comment: xray:Put* requires Resource "*" (only if EnableXRay=true)

  NotificationsRole:
    Type: AWS::IAM::Role
    Condition: ManageNotifications
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: bucket-notifications
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt NotificationsLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetBucketNotification, s3:PutBucketNotification]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}"

  # ------------------------------------------------------------------ functions
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-ingest"
      Description: Idempotent ingestion of .tfstate versions (Object Created/Deleted events)
      Handler: terraformation.handlers.state_ingest.handler
      CodeUri: ../../backend/build/package/
      Role: !GetAtt IngestRole.Arn
      Timeout: 300
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref IngestReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref IngestLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !Ref DlqArn }
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: The DLQ is configured via EventInvokeConfig (OnFailure) and on the EventBridge target
          - id: CKV_AWS_117
            comment: The function does not need a VPC; it only accesses public AWS services
          - id: CKV_AWS_173
            comment: Environment variables hold no secrets
          - id: CKV_AWS_115
            comment: Reserved concurrency is optional via parameter (new accounts cannot reserve)

  LockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-locks"
      Description: Locking state and history derived from the .tflock files
      Handler: terraformation.handlers.lock_ingest.handler
      CodeUri: ../../backend/build/package/
      Role: !GetAtt LockRole.Arn
      MemorySize: 256
      Timeout: 60
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LockLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !Ref DlqArn }
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: The DLQ is configured via EventInvokeConfig (OnFailure) and on the EventBridge target
          - id: CKV_AWS_117
            comment: The function does not need a VPC
          - id: CKV_AWS_173
            comment: Environment variables hold no secrets
          - id: CKV_AWS_115
            comment: No reserved concurrency so the account's unreserved minimum is not consumed

  BackfillFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-backfill"
      Description: Initial backfill of .tfstate and .tflock versions (self-reinvokes)
      Handler: terraformation.handlers.backfill.handler
      CodeUri: ../../backend/build/package/
      Role: !GetAtt BackfillRole.Arn
      Timeout: 900
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref BackfillLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !Ref DlqArn }
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: DLQ via EventInvokeConfig (OnFailure)
          - id: CKV_AWS_117
            comment: The function does not need a VPC
          - id: CKV_AWS_173
            comment: Environment variables hold no secrets
          - id: CKV_AWS_115
            comment: One-off function; no reserved concurrency

  ReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-reconcile"
      Description: Periodic reconciliation (safety net) against the S3 versions
      Handler: terraformation.handlers.reconcile.handler
      CodeUri: ../../backend/build/package/
      Role: !GetAtt ReconcileRole.Arn
      Timeout: 900
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ReconcileLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !Ref DlqArn }
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: DLQ via EventInvokeConfig (OnFailure)
          - id: CKV_AWS_117
            comment: The function does not need a VPC
          - id: CKV_AWS_173
            comment: Environment variables hold no secrets
          - id: CKV_AWS_115
            comment: Weekly execution; no reserved concurrency

  # ------------------------------------------------------------------ EventBridge rules
  StateRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AppName}-${Environment}-tfstate"
      Description: Object Created/Deleted of the .tfstate files → ingestion Lambda
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created, Object Deleted]
        detail:
          bucket: { name: [!Ref StateBucketName] }
          object:
            key: [{ suffix: .tfstate }]
      Targets:
        - Id: ingest
          Arn: !GetAtt IngestFunction.Arn
          RetryPolicy: { MaximumRetryAttempts: 8, MaximumEventAgeInSeconds: 21600 }
          DeadLetterConfig: { Arn: !Ref DlqArn }

  LockRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AppName}-${Environment}-tflock"
      Description: Object Created/Deleted of the .tflock files → locks Lambda
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created, Object Deleted]
        detail:
          bucket: { name: [!Ref StateBucketName] }
          object:
            key: [{ suffix: .tfstate.tflock }]
      Targets:
        - Id: locks
          Arn: !GetAtt LockFunction.Arn
          RetryPolicy: { MaximumRetryAttempts: 8, MaximumEventAgeInSeconds: 21600 }
          DeadLetterConfig: { Arn: !Ref DlqArn }

  IngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StateRule.Arn

  LockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LockFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LockRule.Arn

  DlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DlqUrl]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridgeRules
            Effect: Allow
            Principal: { Service: [events.amazonaws.com] }
            Action: sqs:SendMessage
            Resource: !Ref DlqArn
            Condition:
              ArnEquals:
                aws:SourceArn: [!GetAtt StateRule.Arn, !GetAtt LockRule.Arn]

  # ------------------------------------------------------------------ weekly reconciliation
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-reconcile
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt ReconcileFunction.Arn }
              - { Effect: Allow, Action: sqs:SendMessage, Resource: !Ref DlqArn }

  ReconcileScheduleRule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AppName}-${Environment}-reconcile"
      Description: Low-frequency reconciliation (safety net only)
      State: !If [ScheduleOn, ENABLED, DISABLED]
      ScheduleExpression: !Ref ReconcileSchedule
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ReconcileFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"
        RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }
        DeadLetterConfig: { Arn: !Ref DlqArn }

  # ------------------------------------------------------------------ EventBridge activation on the bucket
  NotificationsFunction:
    Type: AWS::Serverless::Function
    Condition: ManageNotifications
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-bucket-notifications"
      Description: Custom resource that enables EventBridge while preserving the bucket's existing configuration
      Handler: terraformation.handlers.bucket_notifications.handler
      CodeUri: ../../backend/build/package/
      Role: !GetAtt NotificationsRole.Arn
      MemorySize: 128
      Timeout: 60
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref NotificationsLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: One-shot custom resource; failures are reported to CloudFormation
          - id: CKV_AWS_117
            comment: No VPC
          - id: CKV_AWS_173
            comment: No secrets
          - id: CKV_AWS_115
            comment: One-off execution

  EnableEventBridge:
    Type: Custom::StateBucketEventBridge
    Condition: ManageNotifications
    Properties:
      ServiceToken: !GetAtt NotificationsFunction.Arn
      ServiceTimeout: 120
      BucketName: !Ref StateBucketName
      DisableOnDelete: !Ref DisableNotificationsOnDelete

Outputs:
  IngestFunctionName: { Value: !Ref IngestFunction }
  LockFunctionName: { Value: !Ref LockFunction }
  BackfillFunctionName: { Value: !Ref BackfillFunction }
  ReconcileFunctionName: { Value: !Ref ReconcileFunction }
