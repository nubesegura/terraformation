        by_module:
          additionalProperties:
            type: integer
          title: By Module
          type: object
        by_provider:
          additionalProperties:
            type: integer
          title: By Provider
          type: object
        by_type:
          additionalProperties:
            type: integer
          title: By Type
          type: object
        current_version_id:
