components:
  schemas:
    ActiveLock:
      properties:
        alert:
          default: false
          description: Lock held longer than the configured threshold
          title: Alert
          type: boolean
        duration_s:
          anyOf:
          - type: integer
          - type: 'null'
          description: Seconds locked so far
          title: Duration S
        lock_id:
          default: ''
          title: Lock Id
          type: string
        operation:
          default: ''
          title: Operation
          type: string
        path:
          default: terraform.tfstate
          title: Path
          type: string
        project:
          title: Project
          type: string
        released_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Released At
        since:
          anyOf:
          - type: string
          - type: 'null'
          description: Start of the active lock (Created of the .tflock)
          title: Since
        status:
          description: locked | released | none_detected (a .tflock was never seen)
          enum:
          - locked
          - released
          - none_detected
          title: Status
          type: string
        who:
          default: ''
          title: Who
          type: string
        workspace:
          title: Workspace
          type: string
      required:
      - status
      - project
      - workspace
      title: ActiveLock
      type: object
    ActiveLocks:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActiveLock'
          title: Items
          type: array
        threshold_minutes:
          title: Threshold Minutes
          type: integer
      required:
      - threshold_minutes
      - items
      title: ActiveLocks
      type: object
    AttrChange:
      properties:
        key:
          title: Key
          type: string
        kind:
          enum:
          - added
          - removed
          - changed
          title: Kind
          type: string
        new:
          anyOf:
          - type: string
          - type: 'null'
          title: New
        old:
          anyOf:
          - type: string
          - type: 'null'
          title: Old
      required:
      - key
      - kind
      title: AttrChange
      type: object
    AwsComponent:
      properties:
        address:
          title: Address
          type: string
        cfn_type:
          anyOf:
          - type: string
          - type: 'null'
          description: Equivalent CloudFormation type, if the map specifies it
          title: Cfn Type
        tf_type:
          title: Tf Type
          type: string
      required:
      - address
      - tf_type
      title: AwsComponent
      type: object
    AwsCoverage:
      properties:
        aws_resources:
          title: Aws Resources
          type: integer
        managed_total:
          title: Managed Total
          type: integer
        mapped:
          title: Mapped
          type: integer
        percent:
          title: Percent
          type: number
        unmapped:
          title: Unmapped
          type: integer
        unmapped_by_reason:
          additionalProperties:
            type: integer
          title: Unmapped By Reason
          type: object
      required:
      - managed_total
      - mapped
      - unmapped
      - percent
      - aws_resources
      - unmapped_by_reason
      title: AwsCoverage
      type: object
    AwsMapCoverage:
      properties:
        map:
          $ref: '#/components/schemas/AwsMapStatus'
        resources:
          title: Resources
          type: integer
        resources_unmapped:
          title: Resources Unmapped
          type: integer
        states_checked:
          title: States Checked
          type: integer
        states_total:
          title: States Total
          type: integer
        truncated:
          description: 'There are more states than `max_states`: coverage is partial'
          title: Truncated
          type: boolean
        types:
          items:
            $ref: '#/components/schemas/MapTypeUsage'
          title: Types
          type: array
        types_unmapped:
          title: Types Unmapped
          type: integer
      required:
      - map
      - states_checked
      - states_total
      - truncated
      - resources
      - resources_unmapped
      - types_unmapped
      - types
      title: AwsMapCoverage
      type: object
    AwsMapStatus:
      properties:
        entries:
          title: Entries
          type: integer
        issues:
          items:
            type: string
          title: Issues
          type: array
        reviewed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed At
        stale:
          description: The map has gone more than `stale_after_days` without review (warning only)
          title: Stale
          type: boolean
        stale_after_days:
          title: Stale After Days
          type: integer
        state:
          enum:
          - ok
          - degraded
          - unavailable
          title: State
          type: string
      required:
      - state
      - stale
      - stale_after_days
      - entries
      title: AwsMapStatus
      type: object
    AwsResourceOut:
      properties:
        cfn_type:
          title: Cfn Type
          type: string
        components:
          items:
            $ref: '#/components/schemas/AwsComponent'
          title: Components
          type: array
        identity:
          title: Identity
          type: string
        name:
          title: Name
          type: string
        primaries:
          items:
            $ref: '#/components/schemas/AwsComponent'
          title: Primaries
          type: array
        status:
          enum:
          - verified
          - provisional
          title: Status
          type: string
      required:
      - cfn_type
      - identity
      - name
      - status
      - primaries
      - components
      title: AwsResourceOut
      type: object
    AwsResources:
      properties:
        coverage:
          $ref: '#/components/schemas/AwsCoverage'
        data:
          items:
            $ref: '#/components/schemas/AwsComponent'
          title: Data
          type: array
        helpers:
          items:
            $ref: '#/components/schemas/AwsComponent'
          title: Helpers
          type: array
        map:
          $ref: '#/components/schemas/AwsMapStatus'
        resources:
          items:
            $ref: '#/components/schemas/AwsResourceOut'
          title: Resources
          type: array
        unmapped:
          items:
            $ref: '#/components/schemas/UnmappedOut'
          title: Unmapped
          type: array
      required:
      - map
      - coverage
      - resources
      - unmapped
      - helpers
      - data
      title: AwsResources
      type: object
    Dashboard:
      properties:
        activity:
          items:
            $ref: '#/components/schemas/DayActivity'
          title: Activity
          type: array
        by_module:
          additionalProperties:
            type: integer
          title: By Module
          type: object
        by_project:
          additionalProperties:
            type: integer
          title: By Project
          type: object
        by_provider:
          additionalProperties:
            type: integer
          title: By Provider
          type: object
        by_type:
          additionalProperties:
            type: integer
          title: By Type
          type: object
        lock_alerts:
          title: Lock Alerts
          type: integer
        lock_threshold_minutes:
          title: Lock Threshold Minutes
          type: integer
        locked:
          title: Locked
          type: integer
        locks:
          items:
            $ref: '#/components/schemas/ActiveLock'
          title: Locks
          type: array
        projects:
          title: Projects
          type: integer
        providers_in_use:
          items:
            type: string
          title: Providers In Use
          type: array
        recent:
          items:
            $ref: '#/components/schemas/ProjectOut'
          title: Recent
          type: array
        resources:
          title: Resources
          type: integer
        states:
          title: States
          type: integer
        terraform_versions:
          additionalProperties:
            type: integer
          title: Terraform Versions
          type: object
        versions:
          title: Versions
          type: integer
      required:
      - projects
      - states
      - resources
      - versions
      - locked
      - lock_alerts
      - lock_threshold_minutes
      - by_type
      - by_provider
      - by_module
      - by_project
      - terraform_versions
      - providers_in_use
      - activity
      - locks
      - recent
      title: Dashboard
      type: object
    DayActivity:
      properties:
        day:
          title: Day
          type: string
        locks:
          default: 0
          title: Locks
          type: integer
        versions:
          default: 0
          title: Versions
          type: integer
      required:
      - day
      title: DayActivity
      type: object
    DiffCounts:
      properties:
        added:
          default: 0
          title: Added
          type: integer
        modified:
          default: 0
          title: Modified
          type: integer
        removed:
          default: 0
          title: Removed
          type: integer
        unchanged:
          default: 0
          title: Unchanged
          type: integer
      title: DiffCounts
      type: object
    DiffSummaryOut:
      properties:
        model_id:
          title: Model Id
          type: string
        summary:
          title: Summary
          type: string
      required:
      - summary
      - model_id
      title: DiffSummaryOut
      type: object
    DiffSummaryRequest:
      properties:
        from_version:
          title: From Version
          type: string
        language:
          default: en
          title: Language
          type: string
        path:
          default: terraform.tfstate
          title: Path
          type: string
        to_version:
          title: To Version
          type: string
        workspace:
          default: default
          title: Workspace
          type: string
      required:
      - from_version
      - to_version
      title: DiffSummaryRequest
      type: object
    Facets:
      properties:
        projects:
          items:
            type: string
          title: Projects
          type: array
        providers:
          additionalProperties:
            type: integer
          title: Providers
          type: object
        resource_types:
          additionalProperties:
            type: integer
          title: Resource Types
          type: object
        terraform_versions:
          additionalProperties:
            type: integer
          title: Terraform Versions
          type: object
      required:
      - resource_types
      - terraform_versions
      - providers
      - projects
      title: Facets
      type: object
    Graph:
      properties:
        edges:
          items:
            $ref: '#/components/schemas/GraphEdge'
          title: Edges
          type: array
        module_edges:
          items:
            $ref: '#/components/schemas/ModuleEdge'
          title: Module Edges
          type: array
        nodes:
          items:
            $ref: '#/components/schemas/GraphNode'
          title: Nodes
          type: array
      title: Graph
      type: object
    GraphEdge:
      properties:
        source:
          title: Source
