    SearchHit:
      properties:
        address:
          title: Address
          type: string
        attributes:
          additionalProperties:
            type: string
          title: Attributes
          type: object
        index:
          default: ''
          title: Index
          type: string
        mode:
          title: Mode
          type: string
        module:
          title: Module
          type: string
        name:
          title: Name
          type: string
        path:
          default: terraform.tfstate
          title: Path
          type: string
        project:
          title: Project
          type: string
        provider:
          title: Provider
          type: string
        type:
          title: Type
          type: string
        workspace:
          title: Workspace
          type: string
      required:
      - project
      - workspace
      - address
      - type
      - name
      - module
      - provider
      - mode
      title: SearchHit
      type: object
    SearchResult:
      properties:
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor for the next page
          title: Cursor
        items:
          items:
            $ref: '#/components/schemas/SearchHit'
          title: Items
          type: array
      required:
      - items
      title: SearchResult
      type: object
    StateDetail:
      properties:
        info:
          $ref: '#/components/schemas/StateInfoOut'
        modules:
          items:
            $ref: '#/components/schemas/ModuleOut'
          title: Modules
          type: array
        outputs:
          items:
            $ref: '#/components/schemas/Output'
          title: Outputs
          type: array
        resources:
          items:
            $ref: '#/components/schemas/Instance'
          title: Resources
          type: array
      required:
      - info
      - outputs
      - modules
      - resources
      title: StateDetail
      type: object
    StateDiff:
      properties:
        added:
          items:
            $ref: '#/components/schemas/ResourceChange'
          title: Added
          type: array
        from:
          $ref: '#/components/schemas/StateInfo'
        modified:
          items:
            $ref: '#/components/schemas/ResourceModified'
          title: Modified
          type: array
        outputs:
          items:
            $ref: '#/components/schemas/OutputChange'
          title: Outputs
          type: array
        removed:
          items:
            $ref: '#/components/schemas/ResourceChange'
          title: Removed
          type: array
        summary:
          $ref: '#/components/schemas/DiffCounts'
        to:
          $ref: '#/components/schemas/StateInfo'
      required:
      - from
      - to
      - summary
      title: StateDiff
      type: object
    StateInfo:
      properties:
        last_modified:
          default: ''
          title: Last Modified
          type: string
        resource_count:
          default: 0
          title: Resource Count
          type: integer
        serial:
          default: 0
          title: Serial
          type: integer
        terraform_version:
          default: ''
          title: Terraform Version
          type: string
        version_id:
          default: ''
          title: Version Id
          type: string
      title: StateInfo
      type: object
    StateInfoOut:
      properties:
        last_modified:
          title: Last Modified
          type: string
        lineage:
          title: Lineage
          type: string
        path:
          default: terraform.tfstate
          title: Path
          type: string
        project:
          title: Project
          type: string
        resource_count:
          title: Resource Count
          type: integer
        s3_bucket:
          title: S3 Bucket
          type: string
        s3_key:
          title: S3 Key
          type: string
        serial:
          title: Serial
          type: integer
        terraform_version:
          title: Terraform Version
          type: string
        version_id:
          title: Version Id
          type: string
        workspace:
          title: Workspace
          type: string
      required:
      - project
      - workspace
      - version_id
      - last_modified
      - terraform_version
      - serial
      - lineage
      - resource_count
      - s3_bucket
      - s3_key
      title: StateInfoOut
      type: object
    Timeline:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TimelineEvent'
          title: Items
          type: array
      required:
      - items
      title: Timeline
      type: object
    TimelineEvent:
      properties:
        added:
          anyOf:
          - type: integer
          - type: 'null'
          title: Added
        duration_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration S
        lock_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Lock Id
        modified:
          anyOf:
          - type: integer
          - type: 'null'
          title: Modified
        operation:
          anyOf:
          - type: string
          - type: 'null'
          title: Operation
        removed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Removed
        resource_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resource Count
        serial:
          anyOf:
          - type: integer
          - type: 'null'
          title: Serial
        terraform_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Terraform Version
        timestamp:
          title: Timestamp
          type: string
        type:
          enum:
          - version
          - delete_marker
          - lock_acquired
          - lock_released
          title: Type
          type: string
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
        who:
          anyOf:
          - type: string
          - type: 'null'
          title: Who
      required:
      - type
      - timestamp
      title: TimelineEvent
      type: object
    UnmappedOut:
      properties:
        address:
          title: Address
          type: string
        detail:
          default: ''
          title: Detail
          type: string
        module:
          default: root
          title: Module
          type: string
        reason:
          description: no_rule | non_aws_provider | missing_identity | missing_parent_ref | orphan_child
            | ambiguous_parent | invalid_map_entry | map_unavailable
          title: Reason
          type: string
        tf_type:
          title: Tf Type
          type: string
      required:
      - address
      - tf_type
      - reason
      title: UnmappedOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VersionList:
      properties:
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor for the next page
          title: Cursor
        items:
          items:
            $ref: '#/components/schemas/VersionOut'
          title: Items
          type: array
      required:
      - items
      title: VersionList
      type: object
    VersionOut:
      properties:
        added:
          default: 0
          title: Added
          type: integer
        is_current:
          default: false
          title: Is Current
          type: boolean
        kind:
          default: state
          enum:
          - state
          - delete_marker
          title: Kind
          type: string
        last_modified:
          title: Last Modified
          type: string
        lineage:
          default: ''
          title: Lineage
          type: string
        modified:
          default: 0
          title: Modified
          type: integer
        parse_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Parse Error
        removed:
          default: 0
          title: Removed
          type: integer
        resource_count:
          default: 0
          title: Resource Count
          type: integer
        serial:
          default: 0
          title: Serial
          type: integer
        size:
          default: 0
          title: Size
          type: integer
        terraform_version:
          default: ''
          title: Terraform Version
          type: string
        version_id:
          title: Version Id
          type: string
      required:
      - version_id
      - last_modified
      title: VersionOut
      type: object
info:
  description: Read-only API to visualize Terraform states stored in S3.
  title: Terraformation API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/aws-map/coverage:
    get:
      description: Checks the current states of every project and lists the unmapped types.
      operationId: aws_map_coverage_api_aws_map_coverage_get
      parameters:
      - in: query
        name: max_states
        required: false
        schema:
          default: 300
          maximum: 1000
          minimum: 1
          title: Max States
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsMapCoverage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Bucket types the map does not cover yet
      tags:
      - aws-map
  /api/dashboard:
    get:
      operationId: dashboard_api_dashboard_get
      parameters:
      - in: query
        name: days
        required: false
        schema:
          default: 30
          maximum: 90
          minimum: 1
          title: Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Aggregated metrics
      tags:
      - dashboard
  /api/facets:
    get:
      operationId: facets_api_facets_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facets'
          description: Successful Response
      summary: Values for search filters
      tags:
      - search
  /api/locks:
    get:
      operationId: active_locks_api_locks_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveLocks'
          description: Successful Response
      summary: Currently locked projects
      tags:
      - locks
  /api/plans:
    get:
      operationId: list_plans_api_plans_get
      parameters:
      - in: query
        name: lineage
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Lineage
      - in: query
        name: project
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
      - in: query
        name: workspace
        required: false
        schema:
          default: default
          title: Workspace
          type: string
      - in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          title: Path
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Plans of a lineage or project
      tags:
      - plans
    post:
      description: Same payload as terraboard. A change summary is stored, not the raw JSON.
      operationId: submit_plan_api_plans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPayload'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Enviar un plan
      tags:
      - plans
  /api/plans/{lineage}/{plan_id}:
    get:
      operationId: get_plan_api_plans__lineage___plan_id__get
      parameters:
      - in: path
        name: lineage
        required: true
        schema:
          title: Lineage
          type: string
      - in: path
        name: plan_id
        required: true
        schema:
          title: Plan Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Detalle de un plan
      tags:
      - plans
  /api/projects:
    get:
      description: Projects (state = project + workspace) ordered by last modification.
      operationId: list_projects_api_projects_get
      parameters:
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: activity
        required: false
        schema:
          default: true
          title: Activity
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Overview de proyectos
      tags:
      - projects
  /api/projects/{project}:
    get:
      operationId: get_project_api_projects__project__get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Detalle de proyecto
      tags:
      - projects
  /api/projects/{project}/aws-resources:
    get:
      description: Groups Terraform resources into AWS resources; what the map does not recognize goes
        in `unmapped`.
      operationId: aws_resources_api_projects__project__aws_resources_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsResources'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: AWS resources of a state (Terraform → AWS map)
      tags:
      - aws-map
  /api/projects/{project}/diff:
    get:
      operationId: diff_api_projects__project__diff_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - description: versionId origen
        in: query
        name: from_version
        required: true
        schema:
          description: versionId origen
          title: From Version
          type: string
      - description: versionId destino (o `current`)
        in: query
        name: to_version
        required: false
        schema:
          default: current
          description: versionId destino (o `current`)
          title: To Version
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateDiff'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Diff between two versions
      tags:
      - states
  /api/projects/{project}/diff/summary:
    post:
      operationId: diff_summary_api_projects__project__diff_summary_post
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiffSummaryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffSummaryOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Resumen en lenguaje natural (Bedrock, opcional)
      tags:
      - states
  /api/projects/{project}/graph:
    get:
      operationId: graph_api_projects__project__graph_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      - in: query
        name: version
        required: false
        schema:
          default: current
          title: Version
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Grafo de dependencias
      tags:
      - states
  /api/projects/{project}/locks:
    get:
      operationId: project_locks_api_projects__project__locks_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockHistory'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Historial de locks
      tags:
      - locks
  /api/projects/{project}/timeline:
    get:
      description: Versions with change counts and lock/unlock marks, newest first.
      operationId: timeline_api_projects__project__timeline_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Timeline
      tags:
      - projects
  /api/projects/{project}/versions:
    get:
      operationId: list_versions_api_projects__project__versions_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Versions of a state
      tags:
      - projects
  /api/projects/{project}/versions/{version_id}:
    get:
      description: Read from S3 by ``versionId`` and masked in memory. ``current`` = current version.
      operationId: get_state_api_projects__project__versions__version_id__get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - description: Workspace de Terraform
        in: query
        name: workspace
        required: false
        schema:
          default: default
          description: Workspace de Terraform
          title: Workspace
          type: string
      - description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
        in: query
        name: path
        required: false
        schema:
          default: terraform.tfstate
          description: Path of the state inside the project (includes the file, e.g. `network/prod.tfstate`)
          title: Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: State detail at a version
      tags:
      - states
  /api/search:
    get:
      description: "Searches the current version of each state.\n\n* `type` uses GSI1, `name` uses GSI2,\
        \ `project` queries by key; only with attributes is a\n  filtered, bounded Scan done."
      operationId: search_api_search_get
      parameters:
      - description: Tipo exacto, p. ej. aws_s3_bucket
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Tipo exacto, p. ej. aws_s3_bucket
          title: Type
      - description: Exact resource name
        in: query
        name: name
        required: false
        schema:
