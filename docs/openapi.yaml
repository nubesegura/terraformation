        target:
          title: Target
          type: string
      required:
      - source
      - target
      title: GraphEdge
      type: object
    GraphNode:
      properties:
        id:
          title: Id
          type: string
        instances:
          default: 1
          title: Instances
          type: integer
        kind:
          enum:
          - resource
          - data
          - module
          title: Kind
          type: string
        module:
          default: root
          title: Module
          type: string
        name:
          default: ''
          title: Name
          type: string
        provider:
          default: ''
          title: Provider
          type: string
        type:
          default: ''
          title: Type
          type: string
      required:
      - id
      - kind
      title: GraphNode
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Instance:
      additionalProperties: false
      description: A resource instance (``count``/``for_each`` produce several).
      properties:
        address:
          title: Address
          type: string
        attributes:
          additionalProperties:
            type: string
          title: Attributes
          type: object
        base_address:
          title: Base Address
          type: string
        dependencies:
          items:
            type: string
          title: Dependencies
          type: array
        deposed:
          anyOf:
          - type: string
          - type: 'null'
          title: Deposed
        index:
          anyOf:
          - type: string
          - type: 'null'
          title: Index
        mode:
          default: managed
          enum:
          - managed
          - data
          title: Mode
          type: string
        module:
          default: root
          title: Module
          type: string
        name:
          title: Name
          type: string
        provider:
          default: ''
          title: Provider
          type: string
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        type:
          title: Type
          type: string
      required:
      - address
      - base_address
      - type
      - name
      title: Instance
      type: object
    LockHistory:
      properties:
        current:
          $ref: '#/components/schemas/LockOut'
        items:
          items:
            $ref: '#/components/schemas/LockRecord'
          title: Items
          type: array
      required:
      - current
      - items
      title: LockHistory
      type: object
    LockOut:
      properties:
        alert:
          default: false
          description: Lock held longer than the configured threshold
          title: Alert
          type: boolean
        duration_s:
          anyOf:
          - type: integer
          - type: 'null'
          description: Seconds locked so far
          title: Duration S
        lock_id:
          default: ''
          title: Lock Id
          type: string
        operation:
          default: ''
          title: Operation
          type: string
        released_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Released At
        since:
          anyOf:
          - type: string
          - type: 'null'
          description: Start of the active lock (Created of the .tflock)
          title: Since
        status:
          description: locked | released | none_detected (a .tflock was never seen)
          enum:
          - locked
          - released
          - none_detected
          title: Status
          type: string
        who:
          default: ''
          title: Who
          type: string
      required:
      - status
      title: LockOut
      type: object
    LockRecord:
      properties:
        acquired_at:
          title: Acquired At
          type: string
        active:
          default: false
          title: Active
          type: boolean
        alert:
          default: false
          title: Alert
          type: boolean
        duration_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration S
        lock_id:
          title: Lock Id
          type: string
        operation:
          title: Operation
          type: string
        released_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Released At
        terraform_version:
          default: ''
          title: Terraform Version
          type: string
        who:
          title: Who
          type: string
      required:
      - lock_id
      - who
      - operation
      - acquired_at
      title: LockRecord
      type: object
    MapTypeUsage:
      properties:
        cfn_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Cfn Type
        count:
          description: Instances of this type across all reviewed states
          title: Count
          type: integer
        mapped:
          title: Mapped
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
          description: Most frequent 'unmapped' reason (if not mapped)
          title: Reason
        states:
          description: Distinct states where it appears
          title: States
          type: integer
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        tf_type:
          title: Tf Type
          type: string
      required:
      - tf_type
      - count
      - states
      - mapped
      title: MapTypeUsage
      type: object
    ModuleEdge:
      properties:
        count:
          title: Count
          type: integer
        source:
          title: Source
          type: string
        target:
          title: Target
          type: string
      required:
      - source
      - target
      - count
      title: ModuleEdge
      type: object
    ModuleOut:
      properties:
        path:
          title: Path
          type: string
        resource_count:
          title: Resource Count
          type: integer
      required:
      - path
      - resource_count
      title: ModuleOut
      type: object
    Output:
      properties:
        name:
          title: Name
          type: string
        sensitive:
          default: false
          title: Sensitive
          type: boolean
        type:
          default: ''
          title: Type
          type: string
        value:
          default: ''
          title: Value
          type: string
      required:
      - name
      title: Output
      type: object
    OutputChange:
      properties:
        kind:
          enum:
          - added
          - removed
          - changed
          title: Kind
          type: string
        name:
          title: Name
          type: string
        new:
          anyOf:
          - type: string
          - type: 'null'
          title: New
        old:
          anyOf:
          - type: string
          - type: 'null'
          title: Old
      required:
      - name
      - kind
      title: OutputChange
      type: object
    PlanDetail:
      properties:
        ci_url:
          default: ''
          title: Ci Url
          type: string
        counts:
          additionalProperties:
            type: integer
          title: Counts
          type: object
        created_at:
          title: Created At
          type: string
        exit_code:
          default: 0
