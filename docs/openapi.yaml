          type: string
        attributes:
          additionalProperties:
            type: string
          title: Attributes
          type: object
        changes:
          items:
            $ref: '#/components/schemas/AttrChange'
          title: Changes
          type: array
        dependencies_changed:
          default: false
          title: Dependencies Changed
          type: boolean
        module:
          title: Module
          type: string
        name:
          title: Name
